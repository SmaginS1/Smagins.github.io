<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>HUD Interface</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Центр */
.center {
    position: absolute;
    top: 8%;
    width: 100%;
    text-align: center;
    font-size: 42px;
    letter-spacing: 4px;
    color: #c77dff;
    text-shadow:
        0 0 5px #c77dff,
        0 0 15px #9d4edd,
        0 0 25px #7b2cbf;
}

/* Фото */
.photo {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    opacity: 0;
    transition: 1.5s;
    filter: brightness(0.9) contrast(1.1);
    box-shadow:
        0 0 15px rgba(199,125,255,0.25),
        0 0 40px rgba(123,44,191,0.15);
}

/* Боковые панели */
.side {
    position: absolute;
    top: 35%;
    font-size: 22px;
    line-height: 32px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.85);
}

.left  { left: 60px; }
.right { right: 60px; }

/* Курсор печати */
.cursor {
    display: inline-block;
    width: 10px;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* Шум терминала */
.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("https://grainy-gradients.vercel.app/noise.svg");
    opacity: 0.07;
}
</style>
</head>

<body>

<div class="noise"></div>

<div class="center">
    <span id="title"></span><span class="cursor">|</span>
</div>

<img src="photo.jpg" class="photo" id="photo">

<div class="side left">
    <div id="left1"></div>
    <div id="left2"></div>
    <div id="left3"></div>
</div>

<div class="side right">
    <div id="right1"></div>
    <div id="right2"></div>
    <div id="right3"></div>
</div>

<script>
function typeText(element, text, speed, callback) {
    let i = 0;
    function typing() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        } else if (callback) callback();
    }
    typing();
}

/* Боковые быстрее */
typeText(left1,  "СТРОКА 1", 35);
typeText(left2,  "СТРОКА 2", 35);
typeText(left3,  "СТРОКА 3", 35);

typeText(right1, "СТРОКА 1", 35);
typeText(right2, "СТРОКА 2", 35);
typeText(right3, "СТРОКА 3", 35);

/* Центр медленнее + фото */
setTimeout(() => {
    typeText(title, "WELKOM.TO.WEB.SITE", 90, () => {
        document.getElementById("photo").style.opacity = 1;
    });
}, 400);
</script>

</body>
</html>
