<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>My Site</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}

/* Заголовок */
h1 {
    text-align: center;
    margin-top: 40px;
    font-size: 48px;
    color: #c77dff;
    text-shadow: 0 0 5px #c77dff,
                 0 0 10px #9d4edd,
                 0 0 20px #7b2cbf;
}

/* Колонки */
.container {
    display: flex;
    justify-content: space-between;
    padding: 0 100px;
    margin-top: 120px;
    font-size: 24px;
}

/* Курсор */
.cursor::after {
    content: "|";
    margin-left: 5px;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}
</style>
</head>

<body>

<h1>WELKOM.TO.WEB.SITE</h1>

<div class="container">
    <div id="left" class="cursor"></div>
    <div id="right" class="cursor"></div>
</div>

<script>
function typeWriter(elementId, text, speed) {
    let i = 0;
    const el = document.getElementById(elementId);

    function typing() {
        if (i < text.length) {
            el.innerHTML += text[i] === "\n" ? "<br>" : text[i];
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

typeWriter("left",  "СТРОКА 1\nСТРОКА 2\nСТРОКА 3", 60);
typeWriter("right", "СТРОКА 1\nСТРОКА 2\nСТРОКА 3", 60);
</script>

</body>
</html>
