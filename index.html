<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Cyber HUD</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Заголовок */
.center-title {
    position: absolute;
    top: 6%;
    width: 100%;
    text-align: center;
    font-size: 40px;
    letter-spacing: 4px;
    color: #c77dff;
    text-shadow:
        0 0 5px #c77dff,
        0 0 15px #9d4edd,
        0 0 25px #7b2cbf;
}

/* Центральная панель */
.main-panel {
    position: absolute;
    top: 14%;
    left: 18%;
    width: 64%;
    height: 70%;
    border: 1px solid rgba(120,120,255,0.15);
    background: rgba(0,0,0,0.25);
    padding: 30px;
    box-sizing: border-box;
    text-align: center;        /* ВАЖНО: центрируем всё */
}

/* Текст внутри панели */
.main-text {
    font-size: 26px;           /* <<< КРУПНЕЕ */
    line-height: 36px;
    letter-spacing: 2px;
    color: rgba(180,220,255,0.9);
    text-shadow: 0 0 8px rgba(80,120,255,0.35);
}



/* Боковые панели */
.side {
    position: absolute;
    top: 18%;
    width: 240px;
    font-size: 18px;
    line-height: 28px;
    letter-spacing: 1px;
    color: rgba(180,210,255,0.85);
}

.left  { left: 25px; }
.right { right: 25px; }

.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("https://grainy-gradients.vercel.app/noise.svg");
    opacity: 0.06;
}

.cursor {
    display: inline-block;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}
</style>
</head>

<body>

<div class="noise"></div>

<div class="center-title">
    WELKOM.TO.WEB.SITE
</div>

<div class="side left">
[ СИСТЕМА ]<br>
загрузка ........ УСПЕШНО<br>
напряжение ядра ....<br>
МИНИМАЛЬНО<br>
нейролинк ..........<br>
ОТСУТСТВУЕТ<br>
целостность памяти .. 73%
</div>

<div class="side right">
[ СЕТЬ ]<br>
сигнал ............. 56%<br>
задержка ........... НИЗКАЯ<br>
фаервол ............ ОТКЛЮЧЕН<br>
обнаружение трасс ... НЕ НАЙДЕНО<br>
обнаружение прав доступа
</div>

<div class="main-panel">

    <div class="main-text" id="mainText"></div>

    <img src="photo.jpg" class="photo" id="photo">

</div>

<script>
function typeText(text, speed, callback) {
    let i = 0;
    const el = document.getElementById("mainText");

    function typing() {
        if (i < text.length) {
            el.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        } else if (callback) callback();
    }
    typing();
}

const content =
"> initializing interface...\n" +
"> loading modules...\n" +
"> syncing protocols...\n\n" +
"ПЧЕЛКИНА ЕЛИЗАВЕТА АЛЕКСАНДРОВНА\n" +
"РЕСП. КРЫМ Г. АЛУШТА УЛ. ГОРЬКОГО\n\n" +
"ГОД 2007 МЕС 06 ЧИС 23\n" +
"НЕОКОНЧЕННОЕ СРЕДНЕЕ ОБРАЗОВАНИЕ\n" +
"КУЛИНАРНЫЙ ТЕХНИКУМ Г. АЛУШТА\n" +
"СУДИМОСТЕЙ НЕТ";

typeText(content, 35, () => {
    document.getElementById("photo").style.opacity = 1;
});
</script>

</body>
</html>
