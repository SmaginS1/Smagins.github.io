<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Cyberpunk UI</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #070010, #000000);
    color: white;
    font-family: Consolas, monospace;
    overflow: hidden;
}

/* Скан-линии */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events: none;
}

/* Заголовок */
h1 {
    text-align: center;
    margin-top: 40px;
    font-size: 56px;
    letter-spacing: 4px;
    color: #d0a2ff;
    position: relative;
    text-shadow:
        0 0 5px #d0a2ff,
        0 0 15px #9d4edd,
        0 0 30px #7b2cbf;
    animation: glow 2s ease-in-out infinite alternate;
}

/* Glitch эффект */
h1::before,
h1::after {
    content: "WELKOM.TO.WEB.SITE";
    position: absolute;
    left: 0;
    right: 0;
    opacity: 0.7;
}

h1::before {
    color: #ff00c8;
    transform: translate(-2px, 0);
    animation: glitch 2s infinite linear alternate-reverse;
}

h1::after {
    color: #00f0ff;
    transform: translate(2px, 0);
    animation: glitch 1.5s infinite linear alternate-reverse;
}

@keyframes glitch {
    0%  { transform: translate(2px, 0); }
    20% { transform: translate(-2px, 1px); }
    40% { transform: translate(-1px, -1px); }
    60% { transform: translate(1px, 1px); }
    80% { transform: translate(-1px, 0); }
    100%{ transform: translate(2px, -1px); }
}

@keyframes glow {
    from { text-shadow: 0 0 10px #9d4edd, 0 0 20px #7b2cbf; }
    to   { text-shadow: 0 0 20px #d0a2ff, 0 0 40px #9d4edd; }
}

/* Контейнер */
.container {
    display: flex;
    justify-content: space-between;
    padding: 0 140px;
    margin-top: 160px;
    font-size: 22px;
}

/* Колонки */
.column {
    width: 320px;
    line-height: 1.7;
    color: #e7c6ff;
    text-shadow: 0 0 8px rgba(208, 162, 255, 0.35);
}

/* Курсор */
.cursor::after {
    content: "▋";
    margin-left: 8px;
    color: #d0a2ff;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}
</style>
</head>

<body>

<h1>WELKOM.TO.WEB.SITE</h1>

<div class="container">
    <div id="left" class="column cursor"></div>
    <div id="right" class="column cursor"></div>
</div>

<script>
function typeWriter(id, text, speed, delay = 0) {
    const el = document.getElementById(id);
    let i = 0;

    setTimeout(() => {
        function typing() {
            if (i < text.length) {
                el.innerHTML += text[i] === "\n" ? "<br>" : text[i];
                i++;
                setTimeout(typing, speed);
            }
        }
        typing();
    }, delay);
}

typeWriter("left",
`[ SYSTEM ONLINE ]
boot sequence ........ OK
neural link .......... OK
identity ............. VERIFIED`,
35);

typeWriter("right",
`[ NETWORK STATUS ]
signal strength ...... STABLE
firewall ............. BYPASSED
protocol ............. ACTIVE`,
35, 900);
</script>

</body>
</html>
