<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Cyber HUD</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #05010a, #000000);
    color: white;
    font-family: Consolas, monospace;
    overflow: hidden;
}

/* Скан-линии */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.04),
        rgba(255,255,255,0.04) 1px,
        transparent 1px,
        transparent 4px
    );
    pointer-events: none;
}

/* Терминальный шум */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("https://grainy-gradients.vercel.app/noise.svg");
    opacity: 0.15;
    pointer-events: none;
}

/* Заголовок */
h1 {
    text-align: center;
    margin-top: 35px;
    font-size: 54px;
    letter-spacing: 4px;
    color: #d0a2ff;
    text-shadow:
        0 0 6px #d0a2ff,
        0 0 18px #9d4edd,
        0 0 40px #7b2cbf;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #7b2cbf, 0 0 20px #9d4edd; }
    to   { text-shadow: 0 0 20px #d0a2ff, 0 0 50px #9d4edd; }
}

/* HUD панели */
.hud {
    position: absolute;
    top: 120px;
    bottom: 40px;
    width: 340px;
    padding: 20px;
    border: 1px solid rgba(208,162,255,0.25);
    box-shadow: 0 0 25px rgba(157,78,221,0.25);
    background: rgba(15, 5, 25, 0.55);
    backdrop-filter: blur(4px);
    color: #e7c6ff;
    font-size: 20px;
    line-height: 1.6;
}

.left  { left: 40px; }
.right { right: 40px; }

/* Центральная зона */
.center {
    position: absolute;
    top: 140px;
    left: 420px;
    right: 420px;
    bottom: 60px;
    border: 1px solid rgba(208,162,255,0.12);
    box-shadow: inset 0 0 30px rgba(123,44,191,0.2);
    padding: 30px;
    font-size: 22px;
    color: #d0a2ff;
}

/* Курсор */
.cursor::after {
    content: "▋";
    margin-left: 6px;
    animation: blink 1s infinite;
    color: #d0a2ff;
}

@keyframes blink {
    50% { opacity: 0; }
}
</style>
</head>

<body>

<h1>WELKOM.TO.WEB.SITE</h1>

<div class="hud left cursor" id="leftPanel"></div>
<div class="hud right cursor" id="rightPanel"></div>

<div class="center cursor" id="mainPanel"></div>

<script>
function typeWriter(id, text, speed, delay = 0) {
    const el = document.getElementById(id);
    let i = 0;

    setTimeout(() => {
        function typing() {
            if (i < text.length) {
                el.innerHTML += text[i] === "\n" ? "<br>" : text[i];
                i++;
                setTimeout(typing, speed);
            }
        }
        typing();
    }, delay);
}

`[ СИСТЕМА ]

нейролинк ............ АКТИВЕН

[ ПОЛЬЗОВАТЕЛЬ ]

статус ............... В СЕТИ`,
25);

Здарова голова ) шо ты .... думала не смогу )

This environment simulates a secure
cybernetic control interface.

All actions are monitored.`,
30, 400);
</script>

</body>
</html>
