<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>My Site</title>

<style>
body {
    margin: 0;
    background-color: black;
    color: white;
    font-family: Arial, sans-serif;
}

/* Заголовок */
h1 {
    text-align: center;
    margin-top: 40px;
    font-size: 48px;
    color: #c77dff;
    text-shadow:
        0 0 5px #c77dff,
        0 0 10px #9d4edd,
        0 0 20px #7b2cbf;
}

/* Контейнер колонок */
.container {
    display: flex;
    justify-content: space-between;
    margin-top: 100px;
    padding: 0 80px;
    font-size: 24px;
}

/* Текст */
.typing {
    border-right: 2px solid white;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: blinkCursor 0.7s infinite;
}

@keyframes blinkCursor {
    50% { border-color: transparent; }
}
</style>
</head>

<body>

<h1>WELKOM.TO.WEB.SITE</h1>

<div class="container">
    <div>
        <p id="left" class="typing"></p>
    </div>

    <div>
        <p id="right" class="typing"></p>
    </div>
</div>

<script>
function typeWriter(elementId, text, speed) {
    let i = 0;
    function typing() {
        if (i < text.length) {
            document.getElementById(elementId).innerHTML +=
                text.charAt(i) === "\n" ? "<br>" : text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

typeWriter("left",  "СТРОКА 1\nСТРОКА 2\nСТРОКА 3", 80);
typeWriter("right", "СТРОКА 1\nСТРОКА 2\nСТРОКА 3", 80);
</script>

</body>
</html>
