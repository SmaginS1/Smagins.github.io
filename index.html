<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ТЕРМИНАЛ ДОСТУПА</title>

<style>
body {
    margin: 0;
    background: black;
    font-family: Consolas, monospace;
    color: #8be9ff;
    overflow: hidden;
}

/* Шум */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("https://upload.wikimedia.org/wikipedia/commons/3/3f/Noise.gif");
    opacity: 0.05;
    pointer-events: none;
}

/* Центрирование */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

/* Неон */
.neon {
    color: #d580ff;
    text-shadow: 0 0 5px #b84dff, 0 0 15px #6a00ff;
}

.hidden { display: none; }

input {
    background: black;
    border: 1px solid #d580ff;
    color: #d580ff;
    padding: 10px;
    font-size: 16px;
    outline: none;
    text-align: center;
}

/* Архив */
#archive {
    padding: 30px;
    color: #8be9ff;
}

.header {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
    color: #d580ff;
    text-shadow: 0 0 10px #b84dff;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab {
    border: 1px solid rgba(200, 100, 255, 0.4);
    padding: 6px 12px;
    cursor: pointer;
}

.tab:hover {
    background: rgba(150, 0, 255, 0.2);
}

.tab.active {
    background: rgba(150, 0, 255, 0.35);
}

.content {
    display: flex;
    gap: 30px;
    margin-top: 20px;
}

.photo {
    width: 240px;
    height: 300px;
    border: 1px solid rgba(180, 0, 255, 0.3);
    background-size: cover;
    background-position: center;
}

.info {
    font-size: 18px;
    line-height: 1.6;
}
</style>
</head>

            clearInterval(interval);
            lineIndex++;
            setTimeout(typeLogin, 300);
        }
    }, 30);
}

</html>
