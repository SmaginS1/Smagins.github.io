<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Терминал доступа</title>

<style>
    body {
        margin: 0;
        background: radial-gradient(circle, #050b1a, #02040a);
        font-family: Consolas, monospace;
        color: #00e5ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-screen {
        text-align: center;
    }

    .title {
        color: #ff00cc;
        font-size: 28px;
        margin-bottom: 20px;
        text-shadow: 0 0 15px #ff00cc;
    }

    input {
        background: transparent;
        border: 1px solid #00e5ff;
        color: #00e5ff;
        padding: 10px;
        font-size: 16px;
        outline: none;
        width: 220px;
        text-align: center;
    }

    button {
        margin-top: 10px;
        background: transparent;
        border: 1px solid #00e5ff;
        color: #00e5ff;
        padding: 10px 20px;
        cursor: pointer;
    }

    .desktop {
        display: none;
        font-size: 22px;
        color: #00ff9f;
        text-shadow: 0 0 10px #00ff9f;
    }
</style>
</head>

<body>

<div class="login-screen">
    <div class="title">ТЕРМИНАЛ ДОСТУПА</div>
    <input id="password" type="password" placeholder="ВВЕДИТЕ ПАРОЛЬ">
    <br>
    <button onclick="checkPassword()">ВХОД</button>
</div>

<div class="desktop">
    ДОСТУП РАЗРЕШЕН
</div>

<script>
function checkPassword() {
    const input = document.getElementById("password").value.trim();

    if (input === "ARCHIVE") {
        document.querySelector(".login-screen").style.display = "none";
        document.querySelector(".desktop").style.display = "block";
    } else {
        alert("ДОСТУП ЗАПРЕЩЕН");
    }
}

document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPassword();
});
</script>

</body>
</html>
